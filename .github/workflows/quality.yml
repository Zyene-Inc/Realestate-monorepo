name: Production quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quality"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/quality
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      SUPABASE_SECRET_KEY: sb_secret_ci_placeholder
      FRONTEND_URL: http://localhost:3000
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: Coach Johnson Realty <ci@example.com>
      ESIGNATURES_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node ../scripts/verify-repository-standards.mjs
      - run: node ../scripts/verify-migration-ledger.mjs
      - run: npx prisma validate
      - run: npm run build
      - run: npm run lint
      - run: npm run audit:dead-code
      - run: npm run test:cov
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run audit:dead-code
      - run: npm run build
      - run: npm run verify:domains
